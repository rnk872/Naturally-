<h1>🛠 Mini Tools</h1>

<div class="tool">
<h3>Weight Converter</h3>
<input id="kg" placeholder="Kg">
<button onclick="convert()">Convert</button>
<p id="out"></p>
</div>

<script>
function convert(){
let kg=document.getElementById("kg").value;
document.getElementById("out").innerText=
kg+" kg = "+(kg*1000)+" grams";
}
</script>
